plugins {
    id 'java'
    // Applied to subprojects below (not to this aggregator root, which has no main class and must not
    // produce an executable bootJar). `apply false` keeps the versioned plugin available on the classpath.
    id 'org.springframework.boot' version "${spring_boot_version}" apply false
    id 'io.spring.dependency-management' version "${spring_dependency_management_version}"
}

allprojects {
    repositories {
        mavenLocal()
        mavenCentral()
    }

    java {
        sourceCompatibility = '21'
    }

    group = 'vg.identity'
}

subprojects {

    apply plugin: "java"
    apply plugin: "jacoco"
    apply plugin: "org.springframework.boot"
    apply plugin: "io.spring.dependency-management"

    dependencyManagement {
        dependencies {
            dependency "org.projectlombok:lombok:${lombok_version}"

            dependency "org.mapstruct:mapstruct:${mapstruct_version}"
            dependency "org.mapstruct:mapstruct-processor:${mapstruct_version}"
        }
    }

    test {
        useJUnitPlatform()
        testLogging {
            events "PASSED", "SKIPPED", "FAILED", "STANDARD_OUT", "STANDARD_ERROR"
        }
    }

    // Only the runnable application modules produce an executable bootJar. Library modules publish a plain
    // jar (consumable as a project dependency) and skip bootJar, which would otherwise fail the build with
    // "Main class name has not been configured". The plain `jar` stays enabled everywhere for project deps.
    plugins.withId("org.springframework.boot") {
        tasks.named("bootJar") {
            enabled = project.name in ["identity-rest-app", "identity-frontend-vaadin"]
        }
    }

}
