plugins {
    id "java-library"
    id "maven-publish"
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
        }
    }
}

dependencies {
    // The public principal records expose UniqueId (self-explaining, typed identifiers); URI is JDK-only.
    api "vg.unique-id:unique-id-api:${vg_unique_id_version}"

    compileOnly "org.projectlombok:lombok"
    annotationProcessor "org.projectlombok:lombok"

    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    testImplementation "org.assertj:assertj-core"
    // Confirms UniqueId/URI round-trip as JSON strings (T004); UniqueId carries @JsonValue/@JsonCreator.
    testImplementation "tools.jackson.core:jackson-databind"

    testCompileOnly "org.projectlombok:lombok"
    testAnnotationProcessor "org.projectlombok:lombok"
}
