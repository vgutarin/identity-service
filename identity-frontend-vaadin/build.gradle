plugins {
	id "com.vaadin" version "${vaadin_version}"
}

dependencyManagement {
	imports {
		mavenBom "com.vaadin:vaadin-bom:${vaadin_version}"
	}
}

dependencies {
	implementation project(":identity-logic")
	implementation project(":identity-rest-server")

	implementation "com.vaadin:vaadin-spring-boot-starter"
	implementation "com.vaadin:vaadin-dev-server"
	implementation "org.springframework.boot:spring-boot-starter-data-jpa"
	implementation "org.springframework.boot:spring-boot-starter-liquibase"
	implementation "org.springframework.boot:spring-boot-starter-security"
	implementation "vg.unique-id:unique-id-jpa-lib:${vg_unique_id_version}"
	implementation "com.oracle.cloud.spring:spring-cloud-oci-starter-vault:${spring_cloud_oci_version}"

	runtimeOnly "com.h2database:h2"
//	runtimeOnly "vg.unique-id:unique-id-logic:${unique_id_version}"
	runtimeOnly "vg.unique-id:unique-id-rest-client:${vg_unique_id_version}"
	runtimeOnly "com.mysql:mysql-connector-j"

	compileOnly "org.projectlombok:lombok"
	annotationProcessor "org.projectlombok:lombok"
	testImplementation "org.springframework.boot:spring-boot-starter-test"
	testImplementation "com.vaadin:browserless-test-spring"
}

tasks.named("test") {
	useJUnitPlatform()
}
