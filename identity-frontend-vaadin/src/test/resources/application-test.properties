# Test config for browserless view tests: embedded H2 (MySQL compatibility mode) + Liquibase, so the
# full Vaadin+Spring context boots without an external database. Domain services are mocked in the tests,
# so no real data access happens for the view logic under test.
spring.datasource.url=jdbc:h2:mem:fe-view-test;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:liquibase-changelog.yml
spring.jpa.hibernate.ddl-auto=none

# Field-level encryption (test values, mirrors identity-logic test config).
identity.encryption.blind-index-key=test-blind-index-key
identity.encryption.current-key-id=0
identity.encryption.keys.0=dGVzdC1zZWNyZXQta2V5LTEyMzQ1Njc4OTAxMjM0NTY=

identity.email.from=test@example.com
identity.service.public-url=https://test.example.com
identity.telegram.bot.name=
unique-id.rest-client.base-url=http://localhost:8080
identity.rest.api.enabled=false
