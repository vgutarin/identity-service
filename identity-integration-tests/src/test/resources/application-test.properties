server.port=8082

# expose the REST API so the rest-client integration tests can reach /api
identity.rest.api.enabled=true

# identity-rest-client configuration
vg.identity.rest-client.base-url=http://localhost:${server.port}

# database
spring.liquibase.enabled=true
spring.liquibase.url=${spring.datasource.url}
spring.liquibase.user=${spring.datasource.username}
spring.liquibase.password=${spring.datasource.password}
spring.liquibase.change-log=classpath:liquibase-changelog.yml
spring.jpa.hibernate.ddl-auto=none

# field-level encryption (test-only key)
identity.encryption.blind-index-key=test-blind-index-key
identity.encryption.current-key-id=0
identity.encryption.keys.0=dGVzdC1zZWNyZXQta2V5LTEyMzQ1Njc4OTAxMjM0NTY=

identity.email.from=test@example.com
