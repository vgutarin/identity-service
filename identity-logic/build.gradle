plugins {
    id "java-library"
    id "maven-publish"
    id "org.springframework.boot" version "${spring_boot_version}"
    id "io.spring.dependency-management"
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
        }
    }
}

dependencies {
    api project(":identity-api")

    api "org.bouncycastle:bcprov-jdk18on:${bouncycastle_version}"
    implementation "org.springframework.boot:spring-boot-starter"
    implementation "org.springframework.boot:spring-boot-starter-mail"
    implementation "org.springframework.boot:spring-boot-starter-security"
    implementation "org.springframework.boot:spring-boot-starter-data-jpa"
    implementation "org.springframework.boot:spring-boot-starter-validation"
    implementation "org.springframework:spring-web"
    implementation "tools.jackson.core:jackson-databind"

    implementation "vg.unique-id:unique-id-jpa-lib:${vg_unique_id_version}"
    implementation "org.liquibase:liquibase-core"

    compileOnly "org.projectlombok:lombok"
    annotationProcessor "org.projectlombok:lombok"
    compileOnly "org.mapstruct:mapstruct"
    annotationProcessor "org.mapstruct:mapstruct-processor"

    testImplementation "org.springframework.boot:spring-boot-starter-test"
    testImplementation "org.springframework.security:spring-security-test"
    testImplementation "org.assertj:assertj-core"

    testImplementation "vg.lib:test:${vg_lib_version}"

    testImplementation "org.springframework.boot:spring-boot-starter-liquibase"
    // MySQL
    testImplementation "org.springframework.boot:spring-boot-starter-jdbc"
    testRuntimeOnly "com.mysql:mysql-connector-j"

    testImplementation "vg.unique-id:unique-id-logic:${vg_unique_id_version}"

}

tasks.named("test") {
    useJUnitPlatform()
}
